apiVersion: v1
kind: Namespace
metadata:
  name: xiangyu-ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xiangyu-backend-config
  namespace: xiangyu-ai
data:
  PROJECT_NAME: "享宇AI智评"
  VERSION: "2.1.0"
  API_V1_STR: "/api/v1"
  API_ADMIN_STR: "/api/admin"
  
  # 数据库连接 (生产连接 MySQL RDS，需 utf8mb4)
  DATABASE_URL: "mysql+asyncmy://xiangyu_app:AppPassword2026@mysql-service.xiangyu-ai.svc.cluster.local:3306/edd_db?charset=utf8mb4"
  DB_ECHO: "false"

  # 缓存与锁驱动 (生产模式切换为 Redis)
  CACHE_DRIVER: "redis"
  REDIS_URL: "redis://:RedisPassword2026@redis-service.xiangyu-ai.svc.cluster.local:6379/0"

  # MinIO 对象存储
  MINIO_ENDPOINT: "minio-service.xiangyu-ai.svc.cluster.local:9000"
  MINIO_BUCKET_NAME: "my-files"
  MINIO_SECURE: "false"

  # 短信网关配置
  SMS_MODE: "http" # 生产使用 "http"，测试使用 "mock"
  SMS_GATEWAY_URL: "https://api.sms-gateway.com/v1/send"
  SMS_SIGN_NAME: "享宇AI智评"
  SMS_TEMPLATE_CODE: "SMS_20260901_AUTH"
  SMS_CODE_EXPIRE_SECONDS: "300"

  # LLM 网关配置
  LLM_PROVIDER: "newapi"
  NEW_API_BASE_URL: "http://newapi-service.xiangyu-ai.svc.cluster.local:3000/v1"
  NEW_API_MODEL: "deepseek-chat"
  NEW_API_TIMEOUT_SECONDS: "60"

  # 生产公网访问 IP / 域名 (用于短链与法人实名回调)
  PUBLIC_BASE_URL: "https://ai.xiangyu.com"
  CORS_ORIGINS: "https://ai.xiangyu.com,https://admin.xiangyu.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: xiangyu-backend-secret
  namespace: xiangyu-ai
type: Opaque
stringData:
  # JWT 安全密钥
  SECRET_KEY: "xiangyu-ai-production-super-secret-jwt-key-2026"
  
  # MinIO 密钥
  MINIO_ACCESS_KEY: "admin"
  MINIO_SECRET_KEY: "MinioAdminPassword2026"

  # 短信平台账号密码
  SMS_ACCOUNT: "your_sms_account_prod"
  SMS_PASSWORD: "your_sms_password_prod"

  # 微风企金税 API
  WEIFENGQI_APP_KEY: "prod_weifengqi_key"
  WEIFENGQI_APP_SECRET: "prod_weifengqi_secret"

  # New-API / OpenAI Master Key
  NEW_API_KEY: "sk-prod-newapi-master-key"
  OPENAI_API_KEY: "sk-prod-newapi-master-key"

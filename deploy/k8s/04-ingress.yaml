apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xiangyu-ai-ingress
  namespace: xiangyu-ai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  rules:
    - host: ai.xiangyu.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: xiangyu-backend-service
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: xiangyu-backend-service
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: xiangyu-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xiangyu-frontend-service
                port:
                  number: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiangyu-backend
  namespace: xiangyu-ai
  labels:
    app: xiangyu-backend
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: xiangyu-backend
  template:
    metadata:
      labels:
        app: xiangyu-backend
    spec:
      containers:
        - name: backend
          image: registry.cn-hangzhou.aliyuncs.com/xiangyu-ai/backend:v2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: xiangyu-backend-config
            - secretRef:
                name: xiangyu-backend-secret
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: xiangyu-backend-service
  namespace: xiangyu-ai
  labels:
    app: xiangyu-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: xiangyu-backend

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xiangyu-backend-hpa
  namespace: xiangyu-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xiangyu-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
